<body>
<style>
/* Layout: one compact card (widget) that expands into the full list; settings slide over the same card. Old Money dark palette. */
:root{
  --on-wine:#EAE0D0;
  --bg:#141010; --card:#1E1816; --field:#171211; --ink:#EAE0D0; --muted:#9B8D7D; --faint:#6F6259; --line:#352B27;
  --gold:#B49A6C; --gold-hi:#D1B47E; --wine:#7A2A3A; --wine-hi:#93354A; --olive:#8C8A5E; --olive-soft:rgba(140,138,94,.16); --danger:#E07B7B;
  --f-display:"Tenor Sans",Georgia,serif; --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--card);color:var(--ink);font:14px/1.5 var(--f-body);overflow:hidden;user-select:none;border:1px solid var(--line)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.app{display:flex;flex-direction:column;height:100%}
/* header */
.head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line)}
#dragbar{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:default}
.me{width:46px;height:46px;flex:none;border-radius:50%;background:var(--wine);display:grid;place-items:center;font-family:var(--f-display);color:var(--on-wine);font-size:22px;box-shadow:0 0 0 1.5px var(--gold);overflow:hidden;cursor:pointer;border:0;padding:0}
.me img{width:100%;height:100%;object-fit:cover}
.me.sticker{background:none;box-shadow:none;border-radius:0;width:52px;height:52px}
.me.sticker img{object-fit:contain}
.titles{min-width:0;cursor:pointer}
.titles b{display:block;font-family:var(--f-title,var(--f-display));font-weight:400;font-size:17px;letter-spacing:.1em;color:var(--gold);line-height:1.15;white-space:nowrap}
.titles span{font-size:12px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:2px}
.ic{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;padding:0}
.ic:hover{color:var(--gold);background:rgba(180,154,108,.1)}
.ic[aria-pressed=true]{color:var(--gold)}
/* list */
.scroll{flex:1;overflow:auto;padding:4px 14px 10px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.sec{font-family:var(--f-display);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:14px 0 4px;display:flex;justify-content:space-between}
.sec .n{color:var(--faint);font-family:var(--f-body);letter-spacing:0}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--olive);background:transparent;margin-top:2px;padding:0;display:grid;place-items:center}
.done .ck{background:var(--olive)}
.done .ck::after{content:"";width:8px;height:4px;border-left:2px solid var(--card);border-bottom:2px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
.tx{min-width:0;overflow-wrap:anywhere;user-select:text}
.done .tx .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--faint);margin-top:2px}
.chip{background:var(--olive-soft);color:var(--olive);border-radius:5px;padding:0 6px;font-weight:700}
.rem{color:var(--gold)}.rem.due{color:var(--gold-hi);font-weight:700}
.ai{color:var(--gold)}
.acts{display:flex;gap:0;opacity:.55}
.it:hover .acts{opacity:1}
.sun{color:var(--faint)}.sun.on{color:var(--gold-hi)}
.edit{width:100%;border:1px solid var(--gold);background:var(--field);border-radius:6px;padding:2px 6px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
/* assistant */
.bar{border-top:1px solid var(--line);padding:10px 12px 12px}
.reply{font-size:12.5px;color:var(--ink);background:rgba(180,154,108,.08);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;padding:6px 9px;margin-bottom:8px;white-space:pre-wrap}
.reply.err{border-color:var(--danger);color:var(--danger);background:rgba(224,123,123,.08)}
.inrow{display:flex;gap:6px;align-items:flex-end;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 10px}
.inrow:focus-within{border-color:var(--gold)}
#say{flex:1;overflow:hidden;border:0;background:transparent;resize:none;outline:none;max-height:110px;min-height:22px;padding:3px 0;line-height:1.45;user-select:text}
#say::placeholder{color:var(--faint)}
.go{border:0;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;flex:none;padding:0;font-size:15px}
.go.add{background:transparent;color:var(--muted)}.go.add:hover{color:var(--gold)}
.go.mic{background:transparent;color:var(--muted)}.go.mic.rec{color:#fff;background:var(--danger)}
.go.ask{background:var(--wine);color:var(--on-wine);box-shadow:inset 0 0 0 1px var(--gold)}.go.ask:hover{background:var(--wine-hi)}
.go:disabled{opacity:.5;cursor:default}
.hint{font-size:11px;color:var(--faint);margin-top:6px}
.hint a,.link{color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font-size:inherit}
/* settings */
.set{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;z-index:5}
.set[hidden]{display:none}
.set .scroll{padding-top:10px}
.set h3{font-family:var(--f-display);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
.i{width:100%;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:7px 9px;color:var(--ink);user-select:text}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--wine);color:var(--on-wine);border-color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:6px 12px;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:11.5px;color:var(--faint)}
.ok{color:#9FBF86}.bad{color:var(--danger)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer}
.toast{position:absolute;left:12px;right:12px;top:70px;background:var(--wine);color:var(--on-wine);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;z-index:9;box-shadow:0 12px 30px -10px #000}
.toast[hidden]{display:none}
.toast b{display:block;font-family:var(--f-display);letter-spacing:.08em;font-weight:400;color:var(--gold-hi)}
.wiz{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;z-index:8}
.wiz[hidden]{display:none}
.wiz .msgs{flex:1;overflow:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;user-select:text}
.bub.ai{background:var(--field);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.bub.mine{background:var(--wine);color:var(--on-wine);border-top-right-radius:4px;align-self:flex-end}
.bub.ai b{color:var(--gold);font-weight:700}
.ctl{padding:10px 14px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cp{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink)}
.cp:hover,.cp[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.cp.main{background:var(--wine);border-color:var(--gold);color:var(--on-wine)}
.sw{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}.sw i{width:10px;height:14px;border-radius:3px;display:inline-block}
.stk{display:flex;gap:10px;flex-wrap:wrap}
.stk button{border:2px solid var(--line);background:var(--field);border-radius:14px;padding:6px;width:118px;height:118px;display:grid;place-items:center}
.stk button[aria-pressed=true]{border-color:var(--gold)}
.stk img{max-width:100%;max-height:100%;object-fit:contain}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
body.f-hand .titles b{letter-spacing:.02em;font-size:22px;text-transform:none}
body.r-sharp .inrow,body.r-sharp .i,body.r-sharp .btn,body.r-sharp .reply{border-radius:4px}
.rx{border:0;background:transparent;padding:0 2px;font-size:15px;line-height:1;cursor:pointer;border-radius:6px}
.rx:hover{background:var(--olive-soft)}
.pick{position:absolute;z-index:12;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:2px;width:228px;box-shadow:0 14px 30px -12px #000}
.pick button{border:0;background:transparent;font-size:20px;width:34px;height:34px;border-radius:8px;padding:0}
.pick button:hover{background:var(--olive-soft)}
.burst{position:fixed;pointer-events:none;z-index:30;font-size:22px;will-change:transform,opacity}
.praise{position:absolute;left:50%;transform:translateX(-50%);top:62px;background:var(--wine);color:var(--on-wine);border:1px solid var(--gold);border-radius:999px;padding:5px 14px;font-size:13px;z-index:25;white-space:nowrap;box-shadow:0 10px 24px -10px #000}
.praise[hidden]{display:none}
.streak{color:var(--gold)}
.mewrap{position:relative;flex:none}
.sup{border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--field);border-radius:14px;padding:11px 12px;margin:8px 0;font-size:13px}
.sup .h{font-family:var(--fT,serif);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;color:var(--gold);display:flex;justify-content:space-between}
.sup .tt{font-weight:700;margin:6px 0 3px;font-size:14px}.sup .tx{color:var(--soft,var(--ink));opacity:.9}.sup .dir{margin-top:5px;font-weight:600}
.sup .moods{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.sup .moods button,.sup .act{border:1px solid var(--line);background:transparent;border-radius:10px;padding:4px 9px;font-size:12.5px;color:var(--ink)}
.sup .moods button:hover,.sup .act:hover{border-color:var(--gold);color:var(--gold)}.sup .act{margin-top:7px}
.sup .x{background:none;border:0;color:var(--faint);font-size:12px}
.breath{display:grid;place-items:center;gap:10px;padding:10px 0}.breath .c{width:120px;height:120px;border-radius:50%;background:var(--olive);opacity:.7;transform:scale(.45);transition:transform 4s ease-in-out}
.breath .c.in{transform:scale(1)}.breath .c.out{transition-duration:6s}
.day{color:var(--gold);font-size:11.5px}
#dateB.set{border-color:var(--gold);color:var(--gold);font-size:11px;width:auto;padding:0 8px;white-space:nowrap}
.whenp{position:absolute;left:10px;right:10px;bottom:74px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:30}
.whenp .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.whenp .chips button{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:4px 9px;font-size:12.5px}
.whenp .chips button[aria-pressed=true],.whenp .chips button:hover{border-color:var(--gold);color:var(--gold)}
.whenp input{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:4px 7px;font:inherit;font-size:12.5px}
.whenp input::-webkit-calendar-picker-indicator{filter:invert(.6)}
.whenp .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.whenp .ttl{font-size:12px;color:var(--faint);margin-bottom:6px}
.wd{font-size:11px;color:var(--faint);margin-left:4px}
.mood{position:absolute;right:-4px;bottom:-4px;font-size:16px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));pointer-events:none}
.me.hop{animation:hop .6s ease}
@keyframes hop{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
.card{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:9px 11px;margin:8px 0;font-size:13px}
.card .row{gap:6px;margin-top:6px}
.en button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:4px 10px;font-size:13px;color:var(--ink)}
.en button[aria-pressed=true],.en button:hover{border-color:var(--gold);color:var(--gold)}
.carried{color:var(--faint);font-style:italic}
.dim{opacity:.55}
.awards{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.aw{border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
.aw.no{opacity:.35;filter:grayscale(1)}
.rit{display:grid;gap:6px}.rit button{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:7px 10px;color:var(--ink)}
.rit button:hover{border-color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.it{animation:in .2s ease both}@keyframes in{from{opacity:0;transform:translateY(3px)}}}
</style>

<div class="app" id="app">
  <div class="head">
    <div id="dragbar">
      <span class="mewrap"><button class="me" id="me" type="button" title=""></button><span class="mood" id="mood"></span></span>
      <div class="titles" id="titles"><b id="ttl"></b><span id="sub"></span></div>
    </div>
    <div class="tools">
      <button class="ic" id="briefB" type="button">🔊</button>
      <button class="ic" id="pinB" type="button"></button>
      <button class="ic" id="setB" type="button">⚙</button>
      <button class="ic" id="minB" type="button">—</button>
      <button class="ic" id="closeB" type="button">✕</button>
    </div>
  </div>
  <div class="scroll" id="list"></div>
  <div class="bar">
    <div class="reply" id="reply" hidden></div>
    <div class="inrow">
      <textarea id="say" rows="1"></textarea>
      <button class="go add" id="dateB" type="button">📅</button>
      <button class="go add" id="addB" type="button">＋</button>
      <button class="go mic" id="micB" type="button">🎙</button>
      <button class="go add" id="pasteB" type="button" hidden>📋</button>
      <button class="go ask" id="askB" type="button">✦</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="whenp" id="whenP" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="praise" id="praise" hidden></div>
  <div class="set" id="set" hidden></div>
  <div class="wiz" id="wiz" hidden></div>
</div>

}

  S.items=S.items.filter(i=>!Object.values(EX).flat().includes(i.text));
  if(!S.items.length)S.items.push({id:uid(),text:w(mode()==="claude"?"firstTaskClaude":"firstTask"),area:S.areas[S.areas.length-1],done:false,today:todayStr(),createdAt:now(),by:"ai"});
  st.expanded=false;save();$("wiz").hidden=true;wizSize(false);render();if(IS_NL){try{Neutralino.window.setDraggableRegion("dragbar")}catch(e){}}}
/* 5 habits */
function wStep5(){prog(5);bubble(w("habitsAsk"));const st=S.settings;
  ctl(`<div class="chips"><button class="cp" data-d="day" aria-pressed="${st.doneMode!=="hide"}">${esc(w("dDay"))}</button><button class="cp" data-d="hide" aria-pressed="${st.doneMode==="hide"}">${esc(w("dHide"))}</button></div>
   <span class="note">${esc(w("rxAsk"))}</span>
   <div class="chips">${["cute","sport","nature","calm","off"].map(k=>`<button class="cp" data-x="${k}" aria-pressed="${(st.reactions||"cute")===k}">${k==="off"?"":PACKS[k].slice(0,3).join("")+" "}${esc(t("rxNames")[k])}</button>`).join("")}</div>
   <span class="note">${esc(w("remAsk"))}</span>
   <label class="switch" style="margin:0"><input type="checkbox" id="wMo" ${st.morning?"checked":""}> ${esc(w("morning"))} <input class="i" type="time" id="wMt" value="${st.morning||"09:00"}" style="width:110px;padding:3px 6px"></label>
   <label class="switch" style="margin:0"><input type="checkbox" id="wEv" ${st.evening?"checked":""}> ${esc(w("evening"))} <input class="i" type="time" id="wEt" value="${st.evening||"21:00"}" style="width:110px;padding:3px 6px"></label>
   <div class="row"><span class="note">${esc(w("lead"))}:</span><div class="chips">${[0,10,30].map(m=>`<button class="cp" data-r="${m}" aria-pressed="${(st.remindLead||0)===m}">${esc(w("l"+m))}</button>`).join("")}</div></div>
   ${IS_NL&&NL_OS==="Windows"?`<label class="switch" style="margin:0"><input type="checkbox" id="wAu" ${st.autostart?"checked":""}> ${esc(w("autostart"))}</label>`:""}
   <label class="switch" style="margin:0"><input type="checkbox" id="wPi" ${st.pin?"checked":""}> ${esc(w("pin"))}</label>
   <div class="row"><button class="cp main" id="wGo">${esc(w("done"))}</button></div>`);
  const C=$("wzC");
  C.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{st.doneMode=b.dataset.d;C.querySelectorAll("[data-d]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  C.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{st.reactions=b.dataset.x;C.querySelectorAll("[data-x]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));if(pack())celebrate(b,pack()[0],false)});
  C.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{st.remindLead=+b.dataset.r;C.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  $("wGo").onclick=async()=>{st.morning=$("wMo").checked?$("wMt").value:"";st.evening=$("wEv").checked?$("wEt").value:"";st.pin=$("wPi").checked;
    if($("wAu")){st.autostart=$("wAu").checked;await setAutostart(st.autostart)}
    save();bubble("✓","me");wStep6()};
}
/* 6 finish */
function wStep6(){prog(6);const st=S.settings;
  bubble(w("bye").replace("{n}",st.name||"✦"));
  ctl(`<div class="row"><button class="cp main" id="wGo">${esc(w("start"))}</button></div>`);
  $("wGo").onclick=()=>finishWizard();
}
/* ---------- boot ---------- */
async function singleInstance(){
  if(!IS_NL)return true;
  try{const raw=await Neutralino.storage.getData("lock");const l=JSON.parse(raw);if(l&&l.pid!==NL_PID&&Date.now()-l.ts<5000){return false}}catch(e){}
  const beat=async()=>{try{await Neutralino.storage.setData("lock",JSON.stringify({pid:NL_PID,ts:Date.now()}))}catch(e){}};
  await beat();setInterval(beat,2000);return true;
}
(async()=>{
  if(!(await singleInstance())){try{Neutralino.app.exit()}catch(e){}return}
  await load();if(carryOver())save();applyTheme();render();
  if(!S.settings.onboarded)setTimeout(startWizard,300);
  if(IS_NL){
    try{await Neutralino.window.setDraggableRegion("dragbar")}catch(e){}
    Neutralino.events.on("windowClose",async()=>{await saveNow();await releaseLock();Neutralino.app.exit()});
    await applyWindow();
    try{
      const dpr=window.devicePixelRatio||1, SW=Math.round(screen.availWidth*dpr), SH=Math.round(screen.availHeight*dpr);
      const w=Math.round((S.settings.expanded?SIZE.expanded:SIZE.compact).width*dpr);
      const pos=S.settings.pos;
      if(pos&&typeof pos.x==="number"&&pos.x>-50&&pos.x<SW-80&&pos.y>-20&&pos.y<SH-80){await Neutralino.window.move(Math.max(0,Math.min(pos.x,SW-w)),pos.y)}
      else{await Neutralino.window.move(Math.max(0,SW-w-Math.round(24*dpr)),Math.round(60*dpr))}
    }catch(e){}
    setInterval(async()=>{try{const z=await Neutralino.window.getSize();const dpr=window.devicePixelRatio||1;const k=S.settings.expanded?"e":"c";const w=Math.round(z.width/dpr),h=Math.round(z.height/dpr);const o=(S.settings.sizes||{})[k]||(S.settings.expanded?SIZE.expanded:SIZE.compact);if(lastW&&(Math.abs(w-o.width)>4||Math.abs(h-o.height)>4)){S.settings.sizes=S.settings.sizes||{};S.settings.sizes[k]={width:w,height:h};lastW=z.width;save()}}catch(e){}},2500);
    setInterval(async()=>{try{const p=await Neutralino.window.getPosition();const o=S.settings.pos||{};if(p&&(p.x!==o.x||p.y!==o.y)){S.settings.pos={x:p.x,y:p.y};save()}}catch(e){}},3000);
  }
  checkReminders();setInterval(checkReminders,20000);setInterval(pollShared,1500);
  let day=todayStr();setInterval(()=>{if(todayStr()!==day){day=todayStr();if(carryOver())save();render()}},60000);
})();
</script>
